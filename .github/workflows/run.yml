name: Generate and Upload Dark History Short

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg, eSpeak, and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          pip install -r requirements.txt

      - name: Create Credential Files from Secrets
        run: |
          echo '${{ secrets.CLIENT_SECRET_JSON }}' > client_secret.json
          echo '${{ secrets.YOUTUBE_REFRESH_TOKEN }}' > token.json
          echo '${{ secrets.YOUTUBE_REFRESH_TOKEN }}' > token_b64.txt

      - name: Run Video Generator
        run: python make_video.py

      - name: Upload to YouTube (Private)
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python upload_youtube.py
